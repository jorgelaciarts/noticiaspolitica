name: Actualizar noticias políticas

on:
  schedule:
    # corre cada 30 minutos (hora UTC). Ajusta según necesites.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # permite correrlo manualmente desde la pestaña "Actions"
  push:
    branches: [main]
    paths:
      - "scripts/feeds.json"
      - "scripts/keywords.json"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install feedparser requests

      - name: Ejecutar scraper
        run: python3 scripts/fetch_news.py

      - name: Confirmar y subir cambios si hay noticias nuevas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "Sin novedades."
          else
            git commit -m "Actualizar noticias ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
