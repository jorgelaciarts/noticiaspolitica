name: Actualizar noticias políticas

on:
  schedule:
    # corre cada 15 minutos (hora UTC). Ajusta según necesites.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # permite correrlo manualmente desde la pestaña "Actions"
  push:
    branches: [main]
    paths:
      - "scripts/feeds.json"
      - "scripts/keywords.json"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install feedparser requests langdetect

      - name: Ejecutar scraper
        run: python3 scripts/fetch_news.py

      - name: Confirmar y subir cambios si hay noticias nuevas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "Sin novedades."
          else
            git commit -m "Actualizar noticias ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # si alguien subió cambios justo antes, nos actualizamos primero
            # (reintenta hasta 5 veces por si hay más de un choque seguido)
            for intento in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Choque con otro cambio, reintentando ($intento)..."
              git pull --rebase --autostash origin main
              sleep 3
            done
          fi
